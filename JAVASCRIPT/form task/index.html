<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
        
    </head>
    <title>Form validation </title>
    <body>
        <form  id="myForm">
            <label for="fname">First name</label> <br/>
            <input type="text" id="fname" placeholder="Enter your First name" required>
            <label for="lname">Last name</label> <br/>
            <input type="text" id="lname" placeholder="Enter your Lname" required>
            <label for="email">First name</label> <br/>
            <input type="email" id="email" placeholder="Enter your email" required>
            <label for="mobile">First name</label> <br/>
            <input type="tel" id="mobile" placeholder="Enter your mobile" required>
            <button type="submit">Submit</button>
        </form>

        <script src="./script.js"></script>
    </body>
</html>
