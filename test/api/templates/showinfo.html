<html>
    <head>
        <title>API Template</title>
    </head>
    <body>
        {% for user in data %}
        <h1>User Details</h1>
        <p>First Name: {{ user.username }}</p>
        <p>Last Name: {{ user.last_name }}</p>
        <p>Email: {{ user.email }}</p>
        <p>Date of Birth: {{ user.DOB }}</p>
        {% endfor %}

    </body>
</html>
